<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dine-In Digital Menu | Hotel POS</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @font-face {
      font-family: 'Isiagni';
      src: url('/order/Isiagni.ttf') format('truetype'), url('Isiagni.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --accent-orange: #f97316;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: 'Outfit', 'Noto Sans Sinhala', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    /* Glassmorphism Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
    }

    .isiagni-title {
      font-family: 'Isiagni', var(--font-family);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0px;
      color: #ffffff;
      line-height: 1.1;
    }

    .table-badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Search & Categories Bar */
    .controls-container {
      margin-top: 14px;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px 10px 42px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 4px;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cat-chip.active {
      background: var(--primary-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Main Container */
    main {
      padding: 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Menu Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: rgba(15, 23, 42, 0.5);
    }

    .product-img-fallback {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2.2rem;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 2px;
    }

    .product-sinhala {
      font-size: 0.8rem;
      color: var(--accent-orange);
      margin-bottom: 6px;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .add-btn {
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }

    /* Floating Cart Sheet */
    .floating-cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 480px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 90;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-summary {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cart-count-badge {
      background: var(--accent-orange);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-total-text {
      display: flex;
      flex-direction: column;
    }

    .cart-total-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cart-total-amount {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .view-cart-btn {
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Drawer / Modal Overlays */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .drawer-content {
      background: #1e293b;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .cart-items-list {
      flex-grow: 1;
      overflow-y: auto;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 12px;
    }

    .item-details h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .item-details span {
      font-size: 0.85rem;
      color: #38bdf8;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .order-notes-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 16px;
      outline: none;
    }

    .submit-order-btn {
      width: 100%;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    /* Star Rating Widget */
    .star-rating {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 16px 0;
    }

    .star-rating i {
      font-size: 1.8rem;
      color: #475569;
      cursor: pointer;
      transition: color 0.2s;
    }

    .star-rating i.active {
      color: #f59e0b;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-top">
      <div class="brand-title">
        <img src="mhb_logo.png" alt="Logo" class="brand-logo-img" onerror="this.src='/order/mhb_logo.png'" />
        <div class="brand-text">
          <h1 class="isiagni-title">v£ly »ƒ£Šfzx</h1>
          <p style="font-size: 0.75rem; color: var(--text-muted);">නො: 04 මහා වීදිය, අකුරැස්ස</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="table-badge" id="tableBadge">
          <i class="fa-solid fa-chair"></i> <span id="tableNumberText">Table --</span>
        </div>
        <button onclick="openReviewModal()" style="background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-star"></i> Review
        </button>
      </div>
    </div>

    <!-- Search & Categories -->
    <div class="controls-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search delicious dishes..." onkeyup="filterProducts()" />
      </div>
      <div class="category-tabs" id="categoryTabs">
        <div class="cat-chip active" onclick="selectCategory('all')">All Dishes</div>
      </div>
    </div>
  </header>

  <!-- Main Menu Area -->
  <main>
    <div class="section-title" id="sectionTitle">Menu Items</div>
    <div class="product-grid" id="productGrid">
      <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px 0;">Loading menu catalog...</p>
    </div>
  </main>

  <!-- Floating Cart Bar -->
  <div class="floating-cart-bar" id="floatingCartBar" style="display: none;">
    <div class="cart-summary">
      <div class="cart-count-badge" id="cartBadgeCount">0</div>
      <div class="cart-total-text">
        <span class="cart-total-label">Total Order</span>
        <span class="cart-total-amount" id="cartTotalAmount">Rs. 0.00</span>
      </div>
    </div>
    <button class="view-cart-btn" onclick="openCartDrawer()">
      View Cart <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Cart Modal Drawer -->
  <div class="modal-overlay" id="cartModal">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3><i class="fa-solid fa-basket-shopping" style="color: var(--primary);"></i> Your Table Order</h3>
        <button class="close-btn" onclick="closeCartDrawer()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="cart-items-list" id="cartItemsList">
        <!-- Rendered items dynamically -->
      </div>

      <input type="text" class="order-notes-input" id="orderCustomerName" placeholder="Your Name (Optional)" />
      <input type="text" class="order-notes-input" id="orderSpecialNotes" placeholder="Kitchen instructions (e.g. Less spicy, Extra sauce)" />

      <button class="submit-order-btn" id="submitOrderBtn" onclick="submitDineInOrder()">
        Add Order
      </button>
    </div>
  </div>

  <!-- Order Success & Review Dialog Modal -->
  <div class="modal-overlay" id="reviewModal">
    <div class="drawer-content" style="text-align: center;">
      <i class="fa-solid fa-circle-check" style="font-size: 3.5rem; color: var(--accent-green); margin-bottom: 12px;"></i>
      <h3 style="font-size: 1.3rem; margin-bottom: 6px;">Order Sent to Kitchen!</h3>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">
        Your order has been received by our chefs and POS system.
      </p>

      <div style="background: rgba(30,41,59,0.5); padding: 16px; border-radius: 16px; border: 1px solid var(--card-border); margin-bottom: 20px;">
        <h4 style="font-size: 0.95rem; margin-bottom: 8px;">How was your experience?</h4>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Leave a review for our staff & kitchen</p>

        <div class="star-rating" id="starRating">
          <i class="fa-solid fa-star active" onclick="setRating(1)"></i>
          <i class="fa-solid fa-star active" onclick="setRating(2)"></i>
          <i class="fa-solid fa-star active" onclick="setRating(3)"></i>
          <i class="fa-solid fa-star active" onclick="setRating(4)"></i>
          <i class="fa-solid fa-star active" onclick="setRating(5)"></i>
        </div>

        <input type="text" class="order-notes-input" id="reviewComment" placeholder="Write feedback comment..." style="margin-bottom: 0;" />
      </div>

      <button class="submit-order-btn" onclick="submitReviewAndClose()">
        Submit Review & Return to Menu
      </button>
    </div>
  </div>

  <script>
    // State Variables
    let currentTable = 'Table 1';
    let allProducts = [];
    let allCategories = [];
    let selectedCatId = 'all';
    let cart = [];
    let currentRating = 5;

    // Parse URL Parameter ?table=Table%201
    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const tblParam = urlParams.get('table');
      if (tblParam && tblParam.trim() !== '') {
        currentTable = decodeURIComponent(tblParam.trim());
      }
      document.getElementById('tableNumberText').innerText = currentTable;

      pingSeatedTable();
      fetchCategories();
      fetchProducts();
    }

    async function pingSeatedTable() {
      try {
        await fetch('/api/tables/ping-seated', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ table_number: currentTable })
        });
      } catch (e) {
        console.error('Error pinging seated status:', e);
      }
    }

    async function fetchCategories() {
      try {
        const res = await fetch('/api/categories');
        if (res.ok) {
          allCategories = await res.json();
          renderCategoryTabs();
        }
      } catch (e) {
        console.error('Error loading categories:', e);
      }
    }

    async function fetchProducts() {
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          allProducts = await res.json();
          renderProducts();
        }
      } catch (e) {
        console.error('Error loading products:', e);
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      let html = `<div class="cat-chip ${selectedCatId === 'all' ? 'active' : ''}" onclick="selectCategory('all')">All Dishes</div>`;
      allCategories.forEach(cat => {
        html += `<div class="cat-chip ${selectedCatId === cat.id ? 'active' : ''}" onclick="selectCategory(${cat.id})">${cat.name}</div>`;
      });
      container.innerHTML = html;
    }

    function selectCategory(catId) {
      selectedCatId = catId;
      renderCategoryTabs();
      renderProducts();
    }

    function filterProducts() {
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      let filtered = allProducts.filter(p => p.status === 'active');

      if (selectedCatId !== 'all') {
        filtered = filtered.filter(p => p.category_id == selectedCatId);
      }

      if (searchTerm !== '') {
        filtered = filtered.filter(p => 
          (p.name && p.name.toLowerCase().includes(searchTerm)) ||
          (p.sinhala_name && p.sinhala_name.toLowerCase().includes(searchTerm))
        );
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px 0;">No dishes found matching criteria.</p>`;
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const price = Number(p.active_price || p.price).toFixed(2);
        
        let imageHtml = `<div class="product-img-fallback"><i class="fa-solid fa-utensils"></i></div>`;
        if (p.image_base64 && typeof p.image_base64 === 'string' && p.image_base64.trim().length > 200) {
          const imgSrc = p.image_base64.startsWith('data:') ? p.image_base64 : `data:image/jpeg;base64,${p.image_base64.trim()}`;
          imageHtml = `<img src="${imgSrc}" class="product-img" alt="${p.name}" onerror="this.outerHTML='<div class=\\'product-img-fallback\\'><i class=\\'fa-solid fa-utensils\\'></i></div>'" />`;
        }

        let sinhalaName = p.sinhala_name || '';
        if (sinhalaName.includes('ÓÂ') || sinhalaName.includes('ÓÀ')) {
          sinhalaName = ''; // Filter out broken legacy charset strings if any
        }

        html += `
          <div class="product-card" onclick="addToCart(${p.id})" style="cursor: pointer;">
            ${imageHtml}
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              ${sinhalaName ? `<div class="product-sinhala">${sinhalaName}</div>` : ''}
              <div class="product-bottom">
                <div class="product-price">Rs. ${price}</div>
                <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    // Cart Management
    function addToCart(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      const existingIndex = cart.findIndex(item => item.product_id === productId);
      if (existingIndex !== -1) {
        cart[existingIndex].quantity += 1;
      } else {
        cart.push({
          product_id: product.id,
          name: product.name,
          sinhala_name: product.sinhala_name,
          price: Number(product.active_price || product.price),
          quantity: 1
        });
      }
      updateCartUI();
    }

    function updateQuantity(productId, delta) {
      const index = cart.findIndex(item => item.product_id === productId);
      if (index === -1) return;

      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
      renderCartDrawerItems();
    }

    function updateCartUI() {
      const bar = document.getElementById('floatingCartBar');
      const badge = document.getElementById('cartBadgeCount');
      const totalText = document.getElementById('cartTotalAmount');

      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      if (totalCount > 0) {
        bar.style.display = 'flex';
        badge.innerText = totalCount;
        totalText.innerText = `Rs. ${totalPrice.toFixed(2)}`;
      } else {
        bar.style.display = 'none';
        closeCartDrawer();
      }
    }

    function openCartDrawer() {
      renderCartDrawerItems();
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCartDrawer() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function renderCartDrawerItems() {
      const list = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">Your cart is empty.</p>`;
        return;
      }

      let html = '';
      cart.forEach(item => {
        const itemTotal = (item.price * item.quantity).toFixed(2);
        html += `
          <div class="cart-item-row">
            <div class="item-details">
              <h4>${item.name}</h4>
              <span>Rs. ${itemTotal}</span>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQuantity(${item.product_id}, -1)">-</button>
              <span style="font-weight: 700;">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity(${item.product_id}, 1)">+</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    async function submitDineInOrder() {
      if (cart.length === 0) return;

      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting Order...';

      const customerName = document.getElementById('orderCustomerName').value.trim();
      const notes = document.getElementById('orderSpecialNotes').value.trim();

      const payload = {
        table_number: currentTable,
        customer_name: customerName !== '' ? customerName : `QR (${currentTable})`,
        items: cart.map(i => ({
          product_id: i.product_id,
          quantity: i.quantity,
          notes: notes
        })),
        notes: notes
      };

      try {
        const res = await fetch('/api/customer-orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          cart = [];
          updateCartUI();
          closeCartDrawer();
          alert('Order added successfully! You can add more items anytime.');
        } else {
          const errData = await res.json();
          alert('Failed to place order: ' + (errData.error || 'Server error'));
        }
      } catch (e) {
        alert('Network error placing order: ' + e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Add Order';
      }
    }

    // Review Modal Functions
    function openReviewModal() {
      document.getElementById('reviewModal').classList.add('active');
    }

    function setRating(rating) {
      currentRating = rating;
      const stars = document.querySelectorAll('#starRating i');
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    async function submitReviewAndClose() {
      const comment = document.getElementById('reviewComment').value.trim();
      try {
        await fetch('/api/customer-reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            table_number: currentTable,
            customer_name: `Customer (${currentTable})`,
            rating: currentRating,
            comment: comment
          })
        });
      } catch (e) {
        console.error('Error submitting review:', e);
      }
      document.getElementById('reviewModal').classList.remove('active');
    }

    // Start App
    window.onload = initApp;
  </script>
</body>
</html>
